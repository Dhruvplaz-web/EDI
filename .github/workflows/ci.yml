name: Praxis AI CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Check (tsc)
        run: npx tsc --noEmit

      - name: ESLint Code Inspection
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
